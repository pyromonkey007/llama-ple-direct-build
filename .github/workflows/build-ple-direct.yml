name: Build PLE-Direct Windows CUDA 12.4 sm61

# Read-only cloud build of the experimental PLE-direct llama.cpp commit.
# Produces a portable llama-server package for a GTX 1080 Ti (sm_61) with
# BOTH CPU and CUDA backends enabled (mixed inference).
#
# Hardening:
#   * local source patch: per-worker manual-reset OVERLAPPED event for the Windows
#     direct PLE reader (windows_ple_readfile_patch: per-worker-event-v2)
#   * cuobjdump proof that ggml-cuda.dll really contains sm_61 code
#   * BUILD-MANIFEST.txt (reproducibility + per-file SHA256), shipped in the ZIP
#   * checkpoint artifact of the raw build
#   * final artifact upload fails on missing files

on:
  workflow_dispatch:

env:
  SRC_REPO: NovNovikov/llama.cpp
  SRC_SHA: 4392224b5e92f39ab6b78c49279101f68fbacec3

jobs:
  build-ple-direct:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout experimental source (pinned to exact SHA)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ env.SRC_SHA }}
          path: src
          fetch-depth: 0
          submodules: recursive

      - name: Verify pinned SHA
        shell: pwsh
        run: |
          $got = (git -C src rev-parse HEAD).Trim()
          Write-Host "checked out: $got"
          if ($got -ne "${{ env.SRC_SHA }}") { throw "SHA mismatch: $got" }

      - name: Source verification (Windows PLE direct reader present in pinned commit)
        shell: pwsh
        run: |
          $lr = "src\src\llama-lazy-reader.h"
          $qx = "src\src\models\qwen4exp.cpp"
          $mx = "src\src\llama-model.cpp"
          if (-not (Test-Path $lr)) { throw "missing $lr" }
          $a = Get-Content $lr -Raw
          foreach ($t in @("CreateFileW","OVERLAPPED","ReadFile")) {
            if ($a -notmatch $t) { throw "llama-lazy-reader.h is missing '$t'" }
          }
          $b = Get-Content $qx -Raw
          if ($b -notmatch 'TENSOR_READ_LAZY')   { throw "qwen4exp.cpp is missing TENSOR_READ_LAZY" }
          if ($b -notmatch 'load_lazy_reader')   { throw "qwen4exp.cpp is missing load_lazy_reader" }
          $c = Get-Content $mx -Raw
          if ($c -notmatch 'direct reads enabled for') { throw "llama-model.cpp is missing the direct-read activation log" }
          Write-Host "OK: Windows PLE direct-read implementation present (CreateFileW/OVERLAPPED/ReadFile + qwen4exp lazy PLE reader)"

      - name: Patch Windows direct read (per-worker manual-reset OVERLAPPED event)
        shell: pwsh
        run: |
          $path = "src\src\llama-lazy-reader.h"
          if (-not (Test-Path $path)) { throw "missing $path" }
          $orig = (Get-Content -LiteralPath $path -Raw) -replace "`r`n", "`n"

          $old1 = @'
          #ifdef _WIN32
              // one positional read; ReadFile takes a DWORD length, so chunk big rows
              void read_exact(size_t off, uint8_t * dst, size_t n) const {
                  while (n > 0) {
                      const DWORD want = n > 0x7FFFFFFFu ? 0x7FFFFFFFu : (DWORD) n;
                      OVERLAPPED ov = {};
                      ov.Offset     = (DWORD) (off & 0xFFFFFFFFu);
                      ov.OffsetHigh = (DWORD) (off >> 32);
                      DWORD done = 0;
                      if (!ReadFile((HANDLE) file, dst, want, &done, &ov)) {
                          if (GetLastError() != ERROR_IO_PENDING ||
                                  !GetOverlappedResult((HANDLE) file, &ov, &done, TRUE)) {
                              throw std::runtime_error(format("lazy direct read of %lu bytes at file offset %zu failed, error %lu",
                                      (unsigned long) want, off, (unsigned long) GetLastError()));
                          }
                      }
                      if (done == 0) {
                          throw std::runtime_error(format("lazy direct read of %lu bytes at file offset %zu failed: unexpected EOF",
                                  (unsigned long) want, off));
                      }
                      dst += (size_t) done;
                      off += (size_t) done;
                      n   -= (size_t) done;
                  }
              }
          '@

          $new1 = @'
          #ifdef _WIN32
              // one positional read; ReadFile takes a DWORD length, so chunk big rows.
              // hEvent is a per-worker manual-reset event owned by run_range() and reused
              // for every row this worker reads. lpNumberOfBytesRead is NULL for the
              // overlapped handle, and the authoritative transfer count always comes from
              // GetOverlappedResult() (bytecount-v1 behavior, preserved).
              void read_exact(size_t off, uint8_t * dst, size_t n, HANDLE hEvent) const {
                  while (n > 0) {
                      const DWORD want = n > 0x7FFFFFFFu ? 0x7FFFFFFFu : (DWORD) n;
                      OVERLAPPED ov = {};
                      ov.Offset     = (DWORD) (off & 0xFFFFFFFFu);
                      ov.OffsetHigh = (DWORD) (off >> 32);
                      ov.hEvent     = hEvent;
                      if (!::ResetEvent(hEvent)) {
                          throw std::runtime_error(format("lazy direct read: ResetEvent failed, error %lu",
                                  (unsigned long) ::GetLastError()));
                      }
                      DWORD done = 0;
                      bool resolve_overlapped = true;
                      if (!::ReadFile((HANDLE) file, dst, want, nullptr, &ov)) {
                          const DWORD err = ::GetLastError();
                          if (err == ERROR_HANDLE_EOF) {
                              resolve_overlapped = false;
                              done = 0;
                          } else if (err != ERROR_IO_PENDING) {
                              throw std::runtime_error(format("lazy direct read of %lu bytes at file offset %zu failed, error %lu",
                                      (unsigned long) want, off, (unsigned long) err));
                          }
                      }
                      if (resolve_overlapped) {
                          if (!::GetOverlappedResult((HANDLE) file, &ov, &done, TRUE)) {
                              const DWORD ov_err = ::GetLastError();
                              if (ov_err == ERROR_HANDLE_EOF) {
                                  done = 0;
                              } else {
                                  throw std::runtime_error(format("lazy direct read of %lu bytes at file offset %zu failed, error %lu",
                                          (unsigned long) want, off, (unsigned long) ov_err));
                              }
                          }
                      }
                      if (done == 0) {
                          throw std::runtime_error(format("lazy direct read of %lu bytes at file offset %zu failed: unexpected EOF",
                                  (unsigned long) want, off));
                      }
                      dst += (size_t) done;
                      off += (size_t) done;
                      n   -= (size_t) done;
                  }
              }
          '@

          $old2 = @'
              void run_range(const std::vector<std::pair<int32_t, int32_t>> & pairs,
                             int64_t begin, int64_t end, float * dst) const {
                  std::vector<uint8_t> bounce(row_size);
          '@

          $new2 = @'
              void run_range(const std::vector<std::pair<int32_t, int32_t>> & pairs,
                             int64_t begin, int64_t end, float * dst) const {
          #ifdef _WIN32
                  // exactly ONE manual-reset event per worker invocation, reused for every
                  // row read below. Passing hEvent == NULL makes the file handle itself the
                  // completion signal, which is unsafe when several overlapped operations
                  // share a single handle.
                  struct handle_guard {
                      HANDLE h;
                      ~handle_guard() { if (h) { ::CloseHandle(h); } }
                  } ev{ ::CreateEventA(nullptr, TRUE, FALSE, nullptr) };
                  if (!ev.h) {
                      throw std::runtime_error(format("lazy direct read: CreateEventA failed, error %lu", (unsigned long) ::GetLastError()));
                  }
          #endif
                  std::vector<uint8_t> bounce(row_size);
          '@

          $old3 = @'
                      const size_t off = base + (size_t) pairs[(size_t) i].first * row_size;
                      read_exact(off, bounce.data(), row_size);
          '@

          $new3 = @'
                      const size_t off = base + (size_t) pairs[(size_t) i].first * row_size;
          #ifdef _WIN32
                      read_exact(off, bounce.data(), row_size, ev.h);
          #else
                      read_exact(off, bounce.data(), row_size);
          #endif
          '@

          $pairs = @(
            @{ o = $old1; n = $new1; what = "read_exact: per-worker hEvent" },
            @{ o = $old2; n = $new2; what = "run_range: one event per worker" },
            @{ o = $old3; n = $new3; what = "call site: pass worker event" }
          )
          $cur = $orig
          foreach ($p in $pairs) {
            $o = $p.o -replace "`r`n", "`n"
            $n = $p.n -replace "`r`n", "`n"
            if (-not $cur.Contains($o)) { throw ("PATCH ANCHOR NOT FOUND (" + $p.what + ")") }
            $cnt = ([regex]::Matches($cur, [regex]::Escape($o))).Count
            if ($cnt -ne 1) { throw ("expected exactly 1 occurrence of anchor (" + $p.what + "), found " + $cnt) }
            $cur = $cur.Replace($o, $n)
          }
          if ($cur -eq $orig) { throw "patch produced no change" }
          Set-Content -LiteralPath $path -Value $cur -NoNewline -Encoding utf8
          Copy-Item -LiteralPath $path -Destination "patched-llama-lazy-reader.h" -Force
          Write-Host "Patched $path (windows_ple_readfile_patch: per-worker-event-v2)"

      - name: Verify applied source patch (fail unless exactly intended)
        shell: pwsh
        run: |
          $path = "src\src\llama-lazy-reader.h"
          $s = Get-Content -LiteralPath $path -Raw

          foreach ($t in @("CreateEvent","TRUE","ResetEvent","ov.hEvent","ERROR_IO_PENDING","GetOverlappedResult","CloseHandle")) {
            if ($s -notmatch [regex]::Escape($t)) { throw "patched file is missing '$t'" }
          }

          if ($s -notmatch [regex]::Escape('::CreateEventA(nullptr, TRUE, FALSE, nullptr)')) {
            throw "CreateEventA(nullptr, TRUE, FALSE, nullptr) not found"
          }
          if ([regex]::Matches($s, 'CreateEventA\(').Count -ne 1) {
            throw "expected exactly one CreateEventA (one event per worker)"
          }
          if ($s -notmatch [regex]::Escape('ov.hEvent     = hEvent;')) {
            throw "OVERLAPPED.hEvent is not assigned the worker event"
          }
          if ([regex]::Matches($s, [regex]::Escape('OVERLAPPED ov = {};')).Count -ne 1) {
            throw "expected exactly one OVERLAPPED usage (the Windows direct read)"
          }
          if ($s -notmatch [regex]::Escape('::ReadFile((HANDLE) file, dst, want, nullptr, &ov)')) {
            throw "bytecount-v1 regression: ReadFile must pass nullptr for lpNumberOfBytesRead"
          }
          if ($s -match [regex]::Escape('ReadFile((HANDLE) file, dst, want, &done, &ov)')) {
            throw "bytecount-v1 regression: ReadFile(..., &done, &ov) must not be used"
          }
          if ($s -notmatch [regex]::Escape('if (!::ResetEvent(hEvent)) {')) {
            throw "ResetEvent return value is not checked"
          }

          foreach ($marker in @('bool resolve_overlapped = true;',                                'if (err == ERROR_HANDLE_EOF) {',
                                'resolve_overlapped = false;',
                                'else if (err != ERROR_IO_PENDING) {',
                                'if (resolve_overlapped) {',
                                'if (ov_err == ERROR_HANDLE_EOF) {')) {
            if ($s -notmatch [regex]::Escape($marker)) { throw "EOF-resolution marker missing: $marker" }
          }
          $iGate = $s.IndexOf('if (resolve_overlapped) {')
          $iGOR  = $s.IndexOf('if (!::GetOverlappedResult((HANDLE) file, &ov, &done, TRUE)) {')
          if ($iGate -lt 0 -or $iGOR -lt 0 -or $iGOR -lt $iGate) {
            throw "GetOverlappedResult is not gated behind resolve_overlapped"
          }
          if ($s.IndexOf('resolve_overlapped = false;') -lt 0 -or $s.IndexOf('resolve_overlapped = false;') -gt $iGate) {
            throw "immediate ERROR_HANDLE_EOF does not set resolve_overlapped=false before the gate"
          }

          # the Windows read path must set hEvent before ReadFile
          $rx = $s.IndexOf('void read_exact(size_t off, uint8_t * dst, size_t n, HANDLE hEvent)')
          if ($rx -lt 0) { throw "v2 read_exact signature not found" }
          $rxEnd = $s.IndexOf('#else', $rx)
          if ($rxEnd -lt 0) { throw "could not isolate Windows read_exact body" }
          $rxBody = $s.Substring($rx, $rxEnd - $rx)
          if ($rxBody -notmatch [regex]::Escape('ov.hEvent     = hEvent;')) { throw "read_exact does not set ov.hEvent" }
          if ($rxBody -notmatch [regex]::Escape('if (!::ResetEvent(hEvent)) {'))    { throw "read_exact does not ResetEvent per read" }
          if ($rxBody -notmatch [regex]::Escape('::GetOverlappedResult'))      { throw "read_exact lacks GetOverlappedResult" }
          if ($rxBody -match 'CreateEvent') { throw "CreateEvent must be per-worker, not inside the per-read function" }

          # CreateEvent must live in run_range (once per worker)
          $rr = $s.IndexOf('void run_range(')
          if ($rr -lt 0) { throw "run_range not found" }
          if ($s.IndexOf('CreateEventA(') -lt $rr) { throw "CreateEventA is not inside run_range" }
          $rrBody = $s.Substring($rr)
          if ($rrBody -notmatch [regex]::Escape('struct handle_guard')) { throw "run_range lacks the RAII handle_guard" }
          if ($rrBody -notmatch [regex]::Escape('CloseHandle(h)'))      { throw "worker event is not closed via RAII" }
          if ($rrBody -notmatch [regex]::Escape('read_exact(off, bounce.data(), row_size, ev.h);')) {
            throw "run_range does not pass the worker event to read_exact on Windows"
          }

          Write-Host "OK: windows_ple_readfile_patch=per-worker-event-v2 verified (one manual-reset event per worker; hEvent set on every overlapped read; RAII close)"

      - name: Record patch diagnostics (pinned commit, git diff, patched sha256)
        shell: pwsh
        run: |
          $commit = (git -C src rev-parse HEAD).Trim()
          Write-Host "pinned commit: $commit"
          if ($commit -ne "${{ env.SRC_SHA }}") { throw "pinned commit mismatch: $commit" }
          Write-Host "--- git diff -- src/llama-lazy-reader.h ---"
          git -C src --no-pager diff -- src/llama-lazy-reader.h | Tee-Object -FilePath patch-diff.txt
          git -C src diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed (whitespace or conflict errors)" }
          $h = (Get-FileHash "src\src\llama-lazy-reader.h" -Algorithm SHA256).Hash
          Write-Host "patched llama-lazy-reader.h SHA256: $h"
          "patched_llama_lazy_reader_sha256=$h" | Set-Content patched-source.sha256
          Write-Host "patch replacements applied: 3/3 (read_exact, run_range prologue, call site)"

      - name: Install CUDA Toolkit 12.4 (official NVIDIA redist, repo action)
        uses: ./src/.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: x64

      - name: Install CUDA cuobjdump 12.4.127 (official NVIDIA redist)
        shell: pwsh
        run: |
          $url = "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cuobjdump/windows-x86_64/cuda_cuobjdump-windows-x86_64-12.4.127-archive.zip"
          $zip = Join-Path $env:RUNNER_TEMP "cuda_cuobjdump-12.4.127.zip"
          $dst = Join-Path $env:RUNNER_TEMP "cuda-cuobjdump-12.4.127"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if (-not (Test-Path $zip)) { throw "download failed: $url" }
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force
          $cuobj = Get-ChildItem $dst -Recurse -Filter cuobjdump.exe | Select-Object -First 1
          if (-not $cuobj) { throw "cuobjdump.exe not found in NVIDIA cuda_cuobjdump archive" }
          & $cuobj.FullName --version
          "CUDA_CUOBJDUMP=$($cuobj.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Discovered cuobjdump: $($cuobj.FullName)"

      - name: Install Ninja
        run: choco install ninja -y

      - name: Record toolchain versions
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          echo === cl === > toolchain.txt
          cl 2>&1 | findstr /C:"Version" >> toolchain.txt
          echo === nvcc === >> toolchain.txt
          nvcc --version >> toolchain.txt 2>&1
          echo === cmake === >> toolchain.txt
          cmake --version >> toolchain.txt 2>&1
          echo === ninja === >> toolchain.txt
          ninja --version >> toolchain.txt 2>&1
          echo === CUDA_PATH=%CUDA_PATH% === >> toolchain.txt
          type toolchain.txt

      - name: Configure (Release, CPU+CUDA, sm_61)
        shell: pwsh
        run: |
          cmd /c '"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 && cmake -S src -B build -G "Ninja Multi-Config" -DGGML_BACKEND_DL=ON -DGGML_CPU=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES=61 -DGGML_CUDA_CUB_3DOT2=ON -DLLAMA_BUILD_BORINGSSL=ON' 2>&1 | Tee-Object -FilePath configure.log

      - name: Build llama-server (Release)
        shell: pwsh
        run: |
          cmd /c '"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 && cmake --build build --config Release --target llama-server -j %NUMBER_OF_PROCESSORS%' 2>&1 | Tee-Object -FilePath build.log

      - name: Static verify (no model load, no GPU required)
        shell: pwsh
        run: |
          $exe = "build\bin\Release\llama-server.exe"
          if (-not (Test-Path $exe)) { throw "llama-server.exe not found at $exe" }
          & $exe --version 2>&1 | Tee-Object -FilePath version.txt
          & $exe --help    2>&1 | Out-File -Encoding utf8 help.txt
          $h = Get-Content help.txt -Raw
          if ($h -notmatch '--lazy-mode') { throw "help is missing --lazy-mode" }
          if ($h -notmatch 'on-direct')   { throw "help is missing on-direct" }
          Write-Host "OK: --lazy-mode and on-direct are present in llama-server --help"

      - name: Checkpoint upload (raw build outputs)
        uses: actions/upload-artifact@v6
        with:
          name: ple-direct-raw-build-checkpoint
          if-no-files-found: error
          path: |
            build/bin/Release/**
            configure.log
            build.log
            version.txt
            help.txt

      - name: Verify sm_61 cubins in ggml-cuda.dll (cuobjdump)
        shell: pwsh
        run: |
          $dll = "build\bin\Release\ggml-cuda.dll"
          if (-not (Test-Path $dll)) { throw "ggml-cuda.dll not found at $dll" }
          $cuobj = $env:CUDA_CUOBJDUMP
          if (-not $cuobj -or -not (Test-Path $cuobj)) { throw "CUDA_CUOBJDUMP missing or invalid: $cuobj" }
          Remove-Item cuda-architectures.txt -ErrorAction SilentlyContinue
          "=== cuobjdump --list-elf $dll ===" | Out-File -Encoding utf8 cuda-architectures.txt
          & $cuobj --list-elf $dll 2>&1 | Out-File -Append -Encoding utf8 cuda-architectures.txt
          "=== cuobjdump --list-ptx $dll ===" | Out-File -Append -Encoding utf8 cuda-architectures.txt
          & $cuobj --list-ptx $dll 2>&1 | Out-File -Append -Encoding utf8 cuda-architectures.txt
          $txt = Get-Content cuda-architectures.txt -Raw
          Write-Host $txt
          if ($txt -notmatch 'sm_61' -and $txt -notmatch 'compute_61') {
            throw "FAIL: no sm_61 / compute_61 evidence found in ggml-cuda.dll (cuobjdump)"
          }
          Write-Host "OK: sm_61 / compute_61 cubin evidence found in ggml-cuda.dll"

      - name: Package portable (exe + all DLLs + CUDA 12.4 runtime)
        shell: pwsh
        run: |
          $pkg = "pkg"
          if (Test-Path $pkg) { Remove-Item $pkg -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "build\bin\Release\*" $pkg -Recurse
          $required = @("llama-server.exe","llama.dll","ggml.dll","ggml-base.dll","ggml-cuda.dll")
          foreach ($r in $required) {
            if (-not (Test-Path (Join-Path $pkg $r)) -and -not (Get-ChildItem $pkg -Recurse -Filter $r -ErrorAction SilentlyContinue)) {
              throw "required build output missing after copy: $r"
            }
          }
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          foreach ($d in @("cudart64_12.dll","cublas64_12.dll","cublasLt64_12.dll")) {
            $s = Join-Path $cudaBin $d
            if (Test-Path $s) { Copy-Item $s $pkg } else { throw "missing CUDA runtime DLL: $d" }
          }
          Copy-Item "cuda-architectures.txt" $pkg -ErrorAction SilentlyContinue
          Copy-Item "patched-llama-lazy-reader.h" $pkg -ErrorAction SilentlyContinue
          Copy-Item "src\LICENSE" $pkg -ErrorAction SilentlyContinue
          Write-Host "--- package contents ---"
          Get-ChildItem $pkg | Select-Object Name,Length | Format-Table -AutoSize

      - name: Build reproducibility manifest (BUILD-MANIFEST.txt)
        shell: pwsh
        run: |
          $pkg = "pkg"
          $L = New-Object System.Collections.Generic.List[string]
          function Add-Line([string]$s) { $L.Add($s) }
          Add-Line "=== PLE-Direct build manifest ==="
          Add-Line ("generated_utc: " + (Get-Date).ToUniversalTime().ToString("o"))
          Add-Line ("source_repository: ${{ env.SRC_REPO }}")
          Add-Line ("source_sha_pinned: ${{ env.SRC_SHA }}")
          Add-Line ("source_commit: ${{ env.SRC_SHA }}")
          Add-Line ("git_rev_parse_HEAD: " + (git -C src rev-parse HEAD).Trim())
          Add-Line ("runner_os: " + $env:RUNNER_OS)
          Add-Line ("runner_image: " + $env:ImageOS)
          Add-Line ("CUDA_PATH: " + $env:CUDA_PATH)
          Add-Line "CMAKE_CUDA_ARCHITECTURES: 61"
          Add-Line "windows_ple_readfile_patch: per-worker-event-v2"
          Add-Line "source_tree_pristine: no (local source patch applied after checkout; pinned SHA recorded above)"
          Add-Line "--- toolchain ---"
          $cm=try{ (cmake --version | Select-Object -First 1) }catch{ "unavailable" }
          Add-Line ("cmake: " + $cm)
          $nj=try{ (ninja --version) }catch{ "unavailable" }
          Add-Line ("ninja: " + $nj)
          $nc=try{ ((nvcc --version) | Select-String 'release') -join ' ' }catch{ "unavailable" }
          Add-Line ("nvcc: " + $nc)
          if (Test-Path toolchain.txt) { Add-Line "--- toolchain.txt (cl/nvcc/cmake/ninja block) ---"; Get-Content toolchain.txt | ForEach-Object { Add-Line $_ } }
          Add-Line "--- CMake configuration flags ---"
          foreach ($f in @(
            "-DGGML_BACKEND_DL=ON","-DGGML_CPU=ON","-DGGML_CPU_ALL_VARIANTS=ON","-DGGML_CUDA=ON",
            "-DGGML_NATIVE=OFF","-DCMAKE_CUDA_ARCHITECTURES=61","-DGGML_CUDA_CUB_3DOT2=ON",
            "-DLLAMA_BUILD_BORINGSSL=ON","-G Ninja Multi-Config","--config Release","--target llama-server")) { Add-Line ("  " + $f) }
          Add-Line "--- package files (name, size_bytes, sha256) ---"
          $files = Get-ChildItem $pkg -File -Recurse | Sort-Object FullName
          foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $rel = $f.FullName.Substring((Resolve-Path $pkg).Path.Length).TrimStart('\')
            Add-Line ("{0}`t{1}`t{2}" -f $rel, $f.Length, $h)
          }
          Add-Line "--- explicitly required checksums ---"
          foreach ($want in @("llama-server.exe","llama.dll","ggml.dll","ggml-base.dll","ggml-cuda.dll",
                              "cudart64_12.dll","cublas64_12.dll","cublasLt64_12.dll")) {
            $hit = $files | Where-Object { $_.Name -eq $want } | Select-Object -First 1
            if ($hit) {
              $h = (Get-FileHash $hit.FullName -Algorithm SHA256).Hash.ToLower()
              Add-Line ("OK   {0}  {1}  {2}" -f $want, $hit.Length, $h)
            } else {
              Add-Line ("MISS {0}" -f $want)
              if ($want -ne "llama.dll") { throw "required package file missing: $want" }
            }
          }
          $cpuVariants = $files | Where-Object { $_.Name -like 'ggml-cpu*.dll' }
          Add-Line ("ggml-cpu variant DLLs: " + $cpuVariants.Count)
          foreach ($cv in $cpuVariants) {
            $h = (Get-FileHash $cv.FullName -Algorithm SHA256).Hash.ToLower()
            Add-Line ("OK   {0}  {1}  {2}" -f $cv.Name, $cv.Length, $h)
          }
          $manifest = Join-Path $pkg "BUILD-MANIFEST.txt"
          $L | Set-Content -LiteralPath $manifest -Encoding utf8
          Write-Host "--- BUILD-MANIFEST.txt ---"
          Get-Content $manifest

      - name: Create ZIP + SHA256
        shell: pwsh
        run: |
          if (Test-Path llama-server-ple-direct-win-cu124-sm61.zip) { Remove-Item llama-server-ple-direct-win-cu124-sm61.zip -Force }
          7z a llama-server-ple-direct-win-cu124-sm61.zip ".\pkg\*"
          if (-not (Test-Path llama-server-ple-direct-win-cu124-sm61.zip)) { throw "ZIP was not created" }
          $hash = (Get-FileHash llama-server-ple-direct-win-cu124-sm61.zip -Algorithm SHA256).Hash
          "$hash  llama-server-ple-direct-win-cu124-sm61.zip" | Set-Content llama-server-ple-direct-win-cu124-sm61.zip.sha256
          Write-Host "ZIP SHA256: $hash"
          Write-Host ("ZIP size bytes: " + (Get-Item llama-server-ple-direct-win-cu124-sm61.zip).Length)

      - name: Upload artifact (zip + sha256)
        uses: actions/upload-artifact@v6
        with:
          name: llama-server-ple-direct-win-cu124-sm61
          if-no-files-found: error
          path: |
            llama-server-ple-direct-win-cu124-sm61.zip
            llama-server-ple-direct-win-cu124-sm61.zip.sha256

      - name: Upload build logs + manifest + cuda architectures + patched source
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-ple-direct
          if-no-files-found: warn
          path: |
            configure.log
            build.log
            help.txt
            version.txt
            toolchain.txt
            cuda-architectures.txt
            patched-llama-lazy-reader.h
            patch-diff.txt
            patched-source.sha256
            pkg\BUILD-MANIFEST.txt
